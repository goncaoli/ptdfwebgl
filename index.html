<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>DutyFree AR</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        /* Remover marcas de água do WebXR Export */
        #unity-webxr-link {
            display: none !important;
        }
        #unity-webgl-logo {
            display: none !important;
        }
        #unity-logo {
            display: none !important;
        }
        #unity-footer {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>

<body>
<div id="unity-container">
    <div id="unity-canvas-container" style="width: 100%; height: 100%;">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
    </div>

    <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>

    <div id="unity-footer">
        <button id="entervr" disabled>VR</button>
        <button id="enterar" disabled>AR</button>
        <div id="unity-build-title">DutyFree AR</div>
    </div>
</div>

<script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/a0eb54968f12b724932ff61ec1f2137c.loader.js";

    var config = {
        dataUrl: buildUrl + "/dcc9f3ae4c70f7542cb9dbb9f02a0d4f.data",
        frameworkUrl: buildUrl + "/2527f42579794508f16440d202a2f229.framework.js",
        codeUrl: buildUrl + "/1ef322908d55c3fce4d942c69c8e7b6b.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Capgemini",
        productName: "DutyFreeAR",
        productVersion: "1.0"
    };

    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var unityInstance = null;

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = (progress * 100) + "%";
        }).then((instance) => {
            unityInstance = instance;
            loadingBar.style.display = "none";
        }).catch((message) => {
            alert(message);
        });
    };

    document.body.appendChild(script);

    /* -----------------------------
       ENVIO DO CARRINHO PARA UNITY
       ----------------------------- */

    function sendCartToUnity(cart) {
        if (!unityInstance) {
            console.log("Unity ainda não está pronto, a tentar novamente...");
            setTimeout(() => sendCartToUnity(cart), 500);
            return;
        }

        console.log("Carrinho enviado para Unity:", cart);
        unityInstance.SendMessage("CartReceiver", "ReceberDadosJSON", JSON.stringify(cart));
    }

    function readCartFromURL() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const dataParam = params.get("data");

        if (!dataParam) {
            console.log("Nenhum carrinho encontrado no URL.");
            return;
        }

        try {
            const decoded = decodeURIComponent(dataParam);
            const cartData = JSON.parse(decoded);
            sendCartToUnity(cartData);
        } catch (e) {
            console.error("Erro ao processar carrinho:", e);
        }
    }

    // Ler carrinho após load
    window.addEventListener("load", readCartFromURL);

    /* -----------------------------
       BOTÕES AR / VR
       ----------------------------- */

    let enterARButton = document.getElementById('enterar');
    let enterVRButton = document.getElementById('entervr');

    document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
    });

    document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
    });

    enterARButton.addEventListener('click', function () {
        unityInstance.Module.WebXR.toggleAR();
    });

    enterVRButton.addEventListener('click', function () {
        unityInstance.Module.WebXR.toggleVR();
    });
</script>

</body>
</html>
