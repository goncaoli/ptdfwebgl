<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | DutyFreeAR</title>
    <meta name="description" content="">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Esconde as marcas de água do Unity/WebGL/WebXR/nome do build.
         Nao esconde #unity-logo de proposito: e o logo de loading que
         aparece enquanto o Unity carrega, antes do nosso overlay entrar. */
      #unity-webgl-logo,
      #unity-webxr-link,
      #unity-build-title,
      #entervr,
      #enterar {
        display: none !important;
      }

      /* Ecrã de entrada em full screen, design DCX */
      #ar-start-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* Só aparece depois de o Unity terminar de carregar E o splash "Made with Unity" terminar (classe adicionada via JS) */
      #ar-start-overlay.visible {
        display: flex;
      }

      #ar-start-icon {
        width: 84px;
        height: 84px;
        margin-bottom: 28px;
      }

      #ar-start-text {
        font-size: 26px;
        font-weight: 600;
        line-height: 1.35;
        max-width: 320px;
        margin: 0 0 40px 0;
      }

      #ar-start-button {
        background: #F4D93E;
        color: #1a1a1a;
        font-size: 18px;
        font-weight: 700;
        border: none;
        border-radius: 32px;
        padding: 18px 40px;
        width: 100%;
        max-width: 340px;
        cursor: pointer;
        font-family: inherit;
      }

      #ar-start-button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container" style="width: 100%; height: 100%;">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <div id="unity-build-title">DutyFreeAR</div>
      </div>
    </div>

    <!-- Ecrã de entrada: começa escondido, só aparece depois do Unity carregar E do
         splash "Made with Unity" terminar. O toque no botão é o "gesto do utilizador"
         exigido pelo browser para arrancar o AR. -->
    <div id="ar-start-overlay">
      <svg id="ar-start-icon" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 22V10a6 6 0 0 1 6-6h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M62 4h12a6 6 0 0 1 6 6v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M80 62v12a6 6 0 0 1-6 6H62" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 80H10a6 6 0 0 1-6-6V62" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M42 22c-9.4 0-17 7.6-17 17 0 12.75 17 29 17 29s17-16.25 17-29c0-9.4-7.6-17-17-17z" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="42" cy="39" r="6" stroke="#fff" stroke-width="3"/>
      </svg>
      <p id="ar-start-text">Tudo pronto para a tua experiência em Realidade Aumentada</p>
      <button id="ar-start-button">Começar a navegação</button>
    </div>

    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/a0eb54968f12b724932ff61ec1f2137c.loader.js";
      var config = {
        dataUrl: buildUrl + "/6ddcdbed792294c0bf2f61199569a2d2.data",
        frameworkUrl: buildUrl + "/d6358e6b268749174f4d05b711cc24b4.framework.js",
        codeUrl: buildUrl + "/db4032ffdea491942f79cb9987abc199.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Capgemini",
        productName: "DutyFreeAR",
        productVersion: "1.0",
      };

      // Duração aproximada do splash "Made with Unity" (+ eventuais outros logos),
      // em milissegundos. Confirma/ajusta este valor em:
      // Project Settings > Player > Splash Screen > Logos (soma da duração de cada logo).
      // Se o splash desaparecer antes ou o overlay demorar demais a aparecer, ajusta aqui.
      var splashScreenDurationMs = 3000;

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var arStartOverlay = document.querySelector("#ar-start-overlay");
      var arStartButton = document.querySelector("#ar-start-button");
      var unityInstance = null;
      var arSupported = false;

      // Extrai o payload do carrinho do fragmento da URL (#data=...) já no arranque,
      // mas só o ENVIAMOS para o Unity mais tarde (ver botão "Começar a navegação"),
      // depois da sessão AR ter arrancado - para o "sphere" (jogador/câmara) já
      // estar na posição real trackada pelo WebXR, e não na posição estática da cena.
      var pendingCartJson = null;
      (function () {
        const hash = window.location.hash.substring(1); // remove o '#' inicial
        const params = new URLSearchParams(hash);
        const rawData = params.get('data');
        pendingCartJson = rawData ? decodeURIComponent(rawData) : null;
      })();

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;

          loadingBar.style.display = "none";

          // O Unity resolve esta promise assim que a instância arranca, o que é
          // normalmente quando o splash "Made with Unity" COMEÇA a animar, não
          // quando termina. Por isso esperamos mais um pouco antes de revelar o
          // nosso overlay, para não sobrepor o splash enquanto ainda está a jogar.
          setTimeout(() => {
            arStartOverlay.classList.add("visible");
          }, splashScreenDurationMs);

          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
        arSupported = event.detail.supported;
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);

      // O toque no botão é o gesto de utilizador exigido pelo WebXR para arrancar o AR.
      // Não é possível arrancar automaticamente sem este toque - é uma exigência de segurança do browser.
      arStartButton.addEventListener('click', function () {
        if (unityInstance && arSupported) {
          unityInstance.Module.WebXR.toggleAR();
          arStartOverlay.classList.remove("visible");

          // Só agora enviamos o carrinho para o Unity, com a sessão AR já a arrancar,
          // para o jogador/câmara já estar (ou já em vias de estar) na posição real.
          if (pendingCartJson) {
            unityInstance.SendMessage(
              'CartReceiverObject',
              'ReceberDadosJSON',
              pendingCartJson
            );
          }
        } else if (unityInstance) {
          alert('Este dispositivo ou browser não suporta Realidade Aumentada.');
        } else {
          alert('A carregar, por favor aguarda mais alguns segundos e tenta novamente.');
        }
      });
    </script>
  </body>
</html>
